name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      - name: ShellCheck test runners
        run: nix shell github:NixOS/nixpkgs/ffbc9f8cbaacfb331b6017d5a5abb21a492c9a38#shellcheck -c shellcheck tests/run_qml_tests.sh tests/run_panel_qml_test.sh
      - name: Lint QML syntax and local contracts
        run: nix shell github:NixOS/nixpkgs/ffbc9f8cbaacfb331b6017d5a5abb21a492c9a38#kdePackages.qtdeclarative -c qmllint --import=disable --unresolved-type=disable --missing-type=disable --unqualified=disable EphemeraDaemon.qml src/components/*.qml src/services/*.qml

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
      - run: node tests/run_tests.js

  qml-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      - name: Run MCP transport and QML lifecycle tests
        run: nix shell github:quickshell-mirror/quickshell/59e9c47b0eb48a9e4bcf9631fa062ee939bd2e83 github:NixOS/nixpkgs/ffbc9f8cbaacfb331b6017d5a5abb21a492c9a38#weston -c tests/run_qml_tests.sh # Quickshell v0.3.0
